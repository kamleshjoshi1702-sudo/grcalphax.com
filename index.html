    const closed=['Accepted','Rejected','Closed'].includes(r.status);
    const thread=(r.comments||[]).map(c=>`<div class="rounded-lg bg-slate-50 p-3 dark:bg-slate-800/60"><div class="flex flex-wrap justify-between gap-2"><span class="text-[11px] font-semibold">${escapeHtml(c.author||'User')} · ${escapeHtml(c.role||'')}</span><span class="text-[10px] text-slate-400">${c.at?new Date(c.at).toLocaleString():''}</span></div><p class="mt-1 whitespace-pre-wrap text-xs">${escapeHtml(c.text||'')}</p></div>`).join('');
    return `<article class="rounded-2xl border border-indigo-200 bg-white p-5 shadow-card dark:border-indigo-900/60 dark:bg-slate-900"><div class="flex flex-wrap items-start justify-between gap-3"><div><div class="text-[10px] font-semibold uppercase tracking-widest text-indigo-600 dark:text-indigo-300">Audit evidence request · ${escapeHtml(r.id)}</div><h3 class="mt-1 text-base font-semibold">${escapeHtml(r.title)}</h3><div class="mt-1 text-xs text-slate-500">${escapeHtml(auditName)} · ${escapeHtml(r.reference||'No criteria reference')}</div></div><span class="rounded-full px-2.5 py-1 text-[10px] font-semibold ${r.status==='Submitted'?'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-300':closed?'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300':'bg-amber-50 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300'}">${escapeHtml(r.status||'Assigned to Auditor')}</span></div><div class="mt-3 grid gap-2 text-xs sm:grid-cols-3"><div><span class="text-slate-400">Requested by</span><div class="mt-1 font-medium">${escapeHtml(r.requestedBy||r.owner||'Audit team')}</div></div><div><span class="text-slate-400">Due date</span><div class="mt-1 font-medium">${escapeHtml(r.dueDate||'Not specified')}</div></div><div><span class="text-slate-400">Assigned to</span><div class="mt-1 font-medium">${escapeHtml(r.assignedAuditorName||r.auditorName||user.name)}</div></div></div>${r.details?`<div class="mt-3 rounded-lg bg-slate-50 p-3 text-xs leading-5 text-slate-700 dark:bg-slate-800/60 dark:text-slate-300"><strong>Instructions:</strong> ${escapeHtml(r.details)}</div>`:''}${r.owner?`<div class="mt-2 text-[11px] text-slate-500">Request owner: ${escapeHtml(r.owner)}</div>`:''}<div class="mt-4 space-y-2">${responses||'<div class="text-xs text-slate-500">No response file submitted yet.</div>'}</div>${r.responseNote?`<div class="mt-3 rounded-lg bg-emerald-50 p-3 text-xs text-emerald-900 dark:bg-emerald-950/30 dark:text-emerald-200"><strong>Latest response:</strong> ${escapeHtml(r.responseNote)}</div>`:''}${thread?`<div class="mt-4 space-y-2 border-t pt-3 dark:border-slate-800"><div class="text-xs font-semibold">Request discussion</div>${thread}</div>`:''}${!closed?`<form class="mt-4 space-y-3 rounded-xl border border-slate-200 p-3 dark:border-slate-700" onsubmit="gaxAuditAuditorSubmitEvidence(event,'${String(r.id).replace(/[^A-Za-z0-9_-]/g,'')}')"><div class="text-xs font-semibold">Submit requested audit evidence</div><label class="block text-xs font-medium">Evidence file (optional when a written response is provided)<input name="file" type="file" accept=".pdf,.doc,.docx,.docm,.odt,.rtf,.txt,.csv,.xls,.xlsx,.ppt,.pptx,.ods,.odp,.png,.jpg,.jpeg" class="mt-1 w-full rounded-lg border border-dashed p-2 text-xs dark:border-slate-700 dark:bg-slate-950"></label><label class="block text-xs font-medium">Response / clarification<textarea name="responseNote" rows="2" maxlength="2000" class="mt-1 w-full rounded-lg border p-2 text-sm dark:border-slate-700 dark:bg-slate-950" placeholder="Describe the evidence supplied or explain any limitation."></textarea></label><div class="flex justify-end"><button class="rounded-lg bg-brand-600 px-4 py-2 text-xs font-semibold text-white">Submit response</button></div></form>`:`<div class="mt-3 text-xs text-slate-500">This request is closed. Contact the audit team if further information is required.</div>`}</article>`;
  }).join('');

  const taskRows=tasks.map(t=>`<tr class="border-b border-slate-100 dark:border-slate-800"><td class="px-4 py-3"><div class="text-sm font-semibold">${escapeHtml(t.title)}</div><div class="mt-1 text-xs text-slate-500">${escapeHtml(t.instructions||t.description||'Review the assigned audit material.')}</div></td><td class="px-4 py-3 text-xs">${escapeHtml(t.framework||'—')}</td><td class="px-4 py-3 text-xs">${escapeHtml(t.dueDate||'Not specified')}</td><td class="px-4 py-3 text-xs">${escapeHtml(t.status||'Assigned')}</td></tr>`).join('');
  const docCount=allowedPolicies.length+sharedEvidence.length;
  const html=`<div class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100"><header class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur-lg dark:border-slate-800 dark:bg-slate-900/90"><div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-3"><div class="flex min-w-0 items-center gap-3"><div class="rounded-md border border-slate-100 bg-white px-2 py-1 dark:border-slate-700"><img src="${GAX_LOGO}" alt="GRCAlphaX" class="block h-auto w-[190px] object-contain" style="max-height:38px"></div><div class="min-w-0"><div class="text-sm font-semibold">Auditor Workspace</div><div class="truncate text-xs text-slate-500">${escapeHtml(state.organisationName||D.org.name)} · ${escapeHtml(user.name)} · ${escapeHtml(user.email||'')}</div></div></div><div class="flex flex-wrap items-center justify-end gap-2">${gaxThemeToggleButton()}${gaxNotificationBellMarkup()}<span class="rounded-full bg-amber-50 px-3 py-1.5 text-[10px] font-semibold text-amber-700 dark:bg-amber-900/30 dark:text-amber-300">Restricted · Assigned access only</span><button type="button" onclick="gaxAuditorRefreshWorkspace()" class="rounded-lg border border-slate-200 px-3 py-2 text-xs font-semibold dark:border-slate-700">Refresh assigned work</button><button onclick="gaxAuthLogout()" class="rounded-lg border border-slate-200 px-3 py-2 text-xs font-semibold dark:border-slate-700">Logout</button></div></div></header><main class="mx-auto max-w-6xl space-y-6 px-5 py-8"><div><div class="text-xs font-medium text-slate-400">External audit / Assigned scope</div><h1 class="mt-1 text-2xl font-semibold">Your audit workspace</h1><p class="mt-2 max-w-3xl text-sm text-slate-500">Only evidence requests, documents and tasks explicitly assigned to your Auditor account are displayed. Use Refresh assigned work after the audit team makes new assignments in another tab.</p></div><div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"><div class="rounded-xl border bg-white p-4 dark:border-slate-800 dark:bg-slate-900"><div class="text-xs text-slate-500">Active access grants</div><div class="mt-2 text-2xl font-semibold">${grants.length}</div></div><div class="rounded-xl border bg-white p-4 dark:border-slate-800 dark:bg-slate-900"><div class="text-xs text-slate-500">Assigned documents</div><div class="mt-2 text-2xl font-semibold">${docCount}</div></div><div class="rounded-xl border bg-white p-4 dark:border-slate-800 dark:bg-slate-900"><div class="text-xs text-slate-500">Open evidence requests</div><div class="mt-2 text-2xl font-semibold">${activeRequestCount}</div></div><div class="rounded-xl border bg-white p-4 dark:border-slate-800 dark:bg-slate-900"><div class="text-xs text-slate-500">Assigned audit tasks</div><div class="mt-2 text-2xl font-semibold">${tasks.length}</div></div></div>${unmatchedGrants.length?`<div class="rounded-xl border border-amber-200 bg-amber-50 p-4 text-xs leading-5 text-amber-900 dark:border-amber-900/60 dark:bg-amber-950/30 dark:text-amber-200"><strong>${unmatchedGrants.length} active grant(s) are not linked to a current file or policy record.</strong> These legacy or unresolved grants do not expose documents. Ask the Super Admin to recreate each assignment against a specific file, policy record or folder.</div>`:''}<section><div class="mb-3 flex flex-wrap items-end justify-between gap-3"><div><h2 class="text-lg font-semibold">Audit evidence requests assigned to you</h2><p class="mt-1 text-xs text-slate-500">Requests raised from Audit Management and assigned to your account. Submit the requested file or written clarification below.</p></div><div class="text-xs text-slate-500">${submittedRequestCount} submitted · ${activeRequestCount} open</div></div><div class="space-y-3">${auditEvidenceRequestCards||'<div class="rounded-2xl border border-dashed bg-white p-6 text-center text-sm text-slate-500 dark:border-slate-700 dark:bg-slate-900"><div class="font-semibold text-slate-700 dark:text-slate-200">No audit evidence requests assigned yet</div><p class="mt-2">The Super Admin or audit team must open <strong>Audit Management → Evidence Requests → Request Evidence</strong>, select your Auditor account in “Assign to Auditor”, and save the request.</p><p class="mt-1 text-xs">After assignment, click Refresh assigned work. The request should appear here without granting access to the rest of the GRC platform.</p></div>'}</div></section><section><div class="mb-3"><h2 class="text-lg font-semibold">Evidence shared with you</h2><p class="mt-1 text-xs text-slate-500">Evidence Vault files approved specifically for your account. Add review comments to clarify your findings.</p></div><div class="space-y-3">${evidenceCards||'<div class="rounded-2xl border border-dashed bg-white p-8 text-center dark:border-slate-700 dark:bg-slate-900"><div class="text-sm font-semibold">No Evidence Vault files shared yet</div><p class="mt-2 text-xs text-slate-500">A Super Admin must approve an exact file assignment before it appears here.</p></div>'}</div></section><section><div class="mb-3"><h2 class="text-lg font-semibold">Policy records shared with you</h2><p class="mt-1 text-xs text-slate-500">Only approved policy records and attachments are available here.</p></div><div class="space-y-3">${policyCards||'<div class="rounded-xl border border-dashed bg-white p-6 text-center text-sm text-slate-500 dark:border-slate-700 dark:bg-slate-900">No policy records have been shared.</div>'}</div></section><section class="overflow-hidden rounded-2xl border bg-white dark:border-slate-800 dark:bg-slate-900"><div class="border-b px-5 py-4 dark:border-slate-800"><h2 class="font-semibold">Audit tasks assigned to you</h2><p class="mt-1 text-xs text-slate-500">Tasks assigned by the Super Admin, including task-only assignments.</p></div><div class="overflow-x-auto"><table class="w-full min-w-[620px] text-left text-sm"><thead class="bg-slate-50 text-[10px] uppercase text-slate-500 dark:bg-slate-800/60"><tr><th class="px-4 py-3">Task</th><th class="px-4 py-3">Framework</th><th class="px-4 py-3">Due date</th><th class="px-4 py-3">Status</th></tr></thead><tbody>${taskRows||'<tr><td colspan="4" class="p-6 text-center text-xs text-slate-500">No audit tasks have been assigned.</td></tr>'}</tbody></table></div></section><div class="rounded-xl border border-amber-200 bg-amber-50 p-4 text-xs leading-5 text-amber-900 dark:border-amber-900/60 dark:bg-amber-950/30 dark:text-amber-200">This standalone prototype uses browser-local data. Refresh can read changes made in another tab of the same browser profile and same file origin. It cannot synchronise with a different computer, browser profile, private window or separately downloaded file. Shared multi-user assignments require the GRCAlphaX backend.</div></main></div>`;
  document.getElementById('app').innerHTML=html;
}

if(!window.__gaxAuditorStorageSyncBound){
  window.__gaxAuditorStorageSyncBound=true;
  window.addEventListener('storage',event=>{
    if([GAX_ADMIN_STORAGE_KEY,GAX_AUDIT_KEY,GAX_EVIDENCE_KEY].includes(event.key)){
      gaxAdminState=null;gaxAuditState=null;gaxEvidenceState=null;
      if(location.hash==='#auditor-workspace'&&gaxAuthCurrentUser()?.role==='AUDITOR')renderAuditor();
    }
  });
  window.addEventListener('focus',()=>{
    if(location.hash==='#auditor-workspace'&&gaxAuthCurrentUser()?.role==='AUDITOR')gaxAuditorReloadLocalState(),renderAuditor();
  });
}



// ROUTER INIT
// ═══════════════════════════════════════════════════════════════════
const routes = {
  '': renderDashboard,
  '#gaps': renderGaps,
  '#risks': renderRisks,
  '#vendors': renderVendors,
  '#audits': renderAuditManagement,
  '#privacy': renderPrivacyManagement,
  '#ai-governance': renderAIGovernance,
  '#evidence': renderEvidenceVault,
  '#monitoring': renderControlMonitoring,
  '#frameworks': renderFrameworkBuilder,
  '#policies': renderPolicies,
  '#integrations': renderIntegrations,
  '#administrator': renderAdministrator,
  '#auditor': renderAuditor, // legacy Auditor route now opens the restricted Auditor workspace
  '#auditor-workspace': renderAuditor,
  '#trust': renderTrust,
};
function route() {
  const hash=location.hash||'';
  if(hash==='#trust'){renderTrust();return;}
  const current=gaxAuthCurrentUser();
  if(hash==='#login'){
    if(current){location.hash=current.role==='AUDITOR'?'#auditor-workspace':'#';return;}
    renderLogin();return;
  }
  if(!current){location.hash='#login';return;}
  // Strict Auditor isolation: no dashboard, gap, risk, vendor, policy, integrations or administrator routes.
  if(current.role==='AUDITOR'){
    if(hash!=='#auditor-workspace'){location.hash='#auditor-workspace';return;}
    renderAuditor();return;
  }
  if(hash==='#auditor-workspace'){location.hash='#';return;}
  // Backward compatibility: old Controls bookmarks now open the unified Gap Assessment.
  if(hash==='#controls'){location.hash='#gaps';return;}
  if((hash==='#administrator'||hash==='#auditor'||hash==='#frameworks')&&current.role!=='SUPER_ADMIN'){renderAccessDenied();return;}
  (routes[hash] || renderDashboard)();
}
window.addEventListener('hashchange', route);
window.addEventListener('load', async () => { await hydratePolicyLibraryFromIndexedDB(); gaxAdminLoad(); route(); if(asvsLoadState!=='loaded') loadASVSRequirements(); });
</script>
