<style>
  :root { --chart-primary: #4f46e5; --chart-grid: #e2e8f0; --chart-dot-fill: #ffffff; }
  html.dark { --chart-primary: #a5b4fc; --chart-grid: #334155; --chart-dot-fill: #0f172a; }
  * { font-feature-settings: 'cv02','cv03','cv04','cv11'; }
  body { font-family: Inter, ui-sans-serif, system-ui; -webkit-font-smoothing: antialiased; }
  .tabular { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
  .fade-up { animation: fadeUp .3s ease both; }
  .card { transition: box-shadow .2s ease, transform .2s ease; }
  .card:hover { box-shadow: 0 4px 6px -1px rgba(15,23,42,.06), 0 10px 20px -4px rgba(15,23,42,.08); }
  aside nav a { min-height: 38px; }
  @media (max-height: 620px) { aside nav { scrollbar-width: thin; } }
  @media (max-width: 900px) { aside { width: 15rem !important; } body > #app > div > div.ml-64 { margin-left: 15rem !important; } }
  #gax-tooltip {
    position: fixed; pointer-events: none; z-index: 100; display: none;
    background: #0f172a; color: #f8fafc; padding: 12px 16px; border-radius: 8px;
    font-size: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); border: 1px solid #1e293b;
    max-width: 280px; transition: opacity 0.1s ease;
  }
  html.dark #gax-tooltip { background: #1e293b; border-color: #334155; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  html.dark ::-webkit-scrollbar-thumb { background: #334155; background-clip: padding-box; border: 2px solid transparent; }
</style>

const tooltipEl = document.getElementById('gax-tooltip');
document.addEventListener('mouseover', (e) => {
  const target = e.target.closest('[data-tooltip]');
  if (!target) return;
  tooltipEl.innerHTML = target.getAttribute('data-tooltip');
  tooltipEl.style.display = 'block';
});
document.addEventListener('mousemove', (e) => {
  if (tooltipEl.style.display === 'none') return;
  const pad = 15;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + tooltipEl.offsetWidth > window.innerWidth) x = e.clientX - tooltipEl.offsetWidth - pad;
  if (y + tooltipEl.offsetHeight > window.innerHeight) y = e.clientY - tooltipEl.offsetHeight - pad;
  tooltipEl.style.left = x + 'px'; tooltipEl.style.top = y + 'px';
});
document.addEventListener('mouseout', (e) => {
  if (!e.target.closest('[data-tooltip]')) return;
  tooltipEl.style.display = 'none';
});
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'fixed bottom-6 right-6 z-[100] rounded-xl bg-slate-900 px-5 py-3 text-sm font-medium text-white shadow-2xl dark:bg-slate-800 dark:ring-1 dark:ring-slate-700 animate-[fadeUp_0.3s_ease]';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(()=>el.remove(), 300); }, 2500);
}
const AV = ['bg-indigo-500','bg-violet-500','bg-emerald-500','bg-amber-500','bg-rose-500','bg-sky-500'];
function avatar(name, size='h-8 w-8') {
  if(!name || name === '—') return `<div class="inline-flex ${size} items-center justify-center rounded-full border border-dashed border-slate-300 text-slate-400 dark:border-slate-600"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>`;
  const initials = name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
  const idx = name.split('').reduce((a,c)=>a+c.charCodeAt(0),0) % AV.length;
  return `<div class="inline-flex ${size} items-center justify-center rounded-full ${AV[idx]} text-[10px] font-semibold text-white ring-2 ring-white dark:ring-slate-900">${initials}</div>`;
}
function isDark() { return document.documentElement.classList.contains('dark'); }

function applyCrosswalks(){
  const byKey = new Map(D.controls.map(c=>[`${c.framework}::${c.id}`,c]));
  D.controls.forEach(c=>{
    // Preserve organisation-defined links created in Framework Builder when the built-in crosswalks refresh.
    const organisationMappings=(c.mappingRefs||[]).filter(r=>r.group==='Organisation-defined mapping');
    c.mappingGroups=[];c.mappingRefs=organisationMappings;
  });
  CONTROL_CROSSWALKS.forEach(group=>{
    const matched=[];
    Object.entries(group.members||{}).forEach(([framework,ids])=>ids.forEach(id=>{
      const c=byKey.get(`${framework}::${id}`); if(c) matched.push(c);
    }));
    if(group.asvsChapters){
      D.controls.filter(c=>c.framework===ASVS_FRAMEWORK && group.asvsChapters.includes((c.id||'').split('.')[0])).forEach(c=>matched.push(c));
    }
    const unique=[...new Map(matched.map(c=>[`${c.framework}::${c.id}`,c])).values()];
    unique.forEach(c=>{
      c.mappingGroups.push({key:group.key,title:group.title});
      // Keep cross-framework links only. Same-framework sibling requirements are not mappings.
      c.mappingRefs.push(...unique.filter(other=>other!==c && other.framework!==c.framework)
        .map(other=>({framework:other.framework,id:other.id,name:other.name,group:group.title})));
    });
  });
  // A requirement can participate in more than one thematic crosswalk; retain all distinct links.
  D.controls.forEach(c=>{
    const refs=[...(c.mappingRefs||[])];
    c.mappingRefs=[...new Map(refs.map(r=>[`${r.framework}::${r.id}`,r])).values()];
    c.mappingGroups=[...new Map((c.mappingGroups||[]).map(g=>[g.key,g])).values()];
  });
}
applyCrosswalks();

async function loadASVSRequirements(){
  if(asvsLoadState==='loaded'||asvsLoadState==='loading-active') return;
  asvsLoadState='loading-active'; asvsLoadError='';
  try{
    let data=null;
    try{
      const cached=localStorage.getItem('gax-asvs-json-v5.0.0');
      if(cached) data=JSON.parse(cached);
    }catch(cacheError){ localStorage.removeItem('gax-asvs-json-v5.0.0'); }
    if(!data){
      const response=await fetch(ASVS_JSON_URL,{cache:'force-cache'});
      if(!response.ok) throw new Error(`OWASP catalogue request returned ${response.status}`);
      data=await response.json();
      try{localStorage.setItem('gax-asvs-json-v5.0.0',JSON.stringify(data));}catch(storageError){console.warn('ASVS catalogue could not be cached in this browser',storageError);}
    }
    if(data.Version!=='5.0.0') throw new Error(`Expected ASVS version 5.0.0; received ${data.Version||'unknown'}`);
    const items=[];
    function walk(nodes,chapterName='',sectionName=''){
      (nodes||[]).forEach(node=>{
        if(node.Description && node.Shortcode){
          items.push(makeControl(ASVS_FRAMEWORK,node.Shortcode,`${node.Shortcode} — ${sectionName||chapterName||'Application security requirement'}`,{
            family:chapterName,subfamily:sectionName,description:node.Description,level:`Level ${node.L||'—'}`,
            source:'OWASP ASVS v5.0.0',assessmentQuestion:node.Description
          }));
        }else if(Array.isArray(node.Items)){
          const nextChapter=node.Shortcode?.startsWith('V') && node.Shortcode.split('.').length===1 ? (node.Name||node.ShortName||chapterName) : chapterName;
          const nextSection=node.Shortcode?.startsWith('V') && node.Shortcode.split('.').length===2 ? (node.Name||sectionName) : sectionName;
          walk(node.Items,nextChapter,nextSection);
        }
      });
    }
    walk(data.Requirements||[]);
    const ids=new Set(items.map(c=>c.id));
    if(items.length!==345 || ids.size!==items.length) throw new Error(`Expected 345 unique ASVS requirements; received ${items.length}`);
    D.controls=D.controls.filter(c=>c.framework!==ASVS_FRAMEWORK).concat(items);
    restoreAssessments();
    applyCrosswalks();
    asvsLoadState='loaded';
    if(location.hash==='#gaps'||location.hash===''||location.hash==='#') route();
    toast('OWASP ASVS 5.0.0 loaded: 345 individual requirements');
  }catch(err){
    asvsLoadState='error'; asvsLoadError=err.message||'Could not load OWASP ASVS catalogue';
    if(location.hash==='#gaps') route();
    console.warn('GRCAlphaX ASVS catalog load failed:',err);
  }
}

function gaxToggleNotifications(){
  const host=document.getElementById('gax-notification-host');if(!host)return;
  const existing=host.querySelector('#gax-notification-panel');
  if(existing){existing.remove();host.querySelector('#gax-notification-bell')?.setAttribute('aria-expanded','false');return;}

}
function gaxCloseNotifications(){const host=document.getElementById('gax-notification-host');host?.querySelector('#gax-notification-panel')?.remove();host?.querySelector('#gax-notification-bell')?.setAttribute('aria-expanded','false');}
function gaxNotificationMarkAllRead(){
  const user=gaxAuthCurrentUser();if(!user)return;const map=gaxNotificationReadMap(),key=gaxNotificationUserKey(user);map[key]=Array.from(new Set([...(map[key]||[]),...gaxNotificationCollect().map(n=>n.id)])).slice(-500);
  try{localStorage.setItem(GAX_NOTIFICATION_READ_KEY,JSON.stringify(map));}catch(err){toast('Could not update notification read status.');return;}
  const host=document.getElementById('gax-notification-host');if(host){host.outerHTML=gaxNotificationBellMarkup();gaxToggleNotifications();}else gaxRefreshNotificationBell();
}
function gaxRefreshNotificationBell(){
  const host=document.getElementById('gax-notification-host');if(!host)return;const wasOpen=!!host.querySelector('#gax-notification-panel');host.outerHTML=gaxNotificationBellMarkup();if(wasOpen)gaxToggleNotifications();
}
function gaxNotificationOpen(id){
  const user=gaxAuthCurrentUser();if(!user)return;
  const item=gaxNotificationCollect().find(n=>n.id===id);if(!item)return;
  const map=gaxNotificationReadMap(),key=gaxNotificationUserKey(user);map[key]=Array.from(new Set([...(map[key]||[]),id])).slice(-500);
  try{localStorage.setItem(GAX_NOTIFICATION_READ_KEY,JSON.stringify(map));}catch(_){}

  if(item.auditTab)gaxAuditTab=item.auditTab;
  if(item.href){if(location.hash===item.href)route();else location.hash=item.href;}
  else gaxRefreshNotificationBell();
}
if(!window.__gaxNotificationSyncBound){
  window.__gaxNotificationSyncBound=true;
  window.addEventListener('storage',event=>{if([GAX_NOTIFICATION_STORAGE_KEY,GAX_NOTIFICATION_READ_KEY,GAX_ADMIN_STORAGE_KEY,GAX_AUDIT_KEY,GAX_EVIDENCE_KEY].includes(event.key))gaxRefreshNotificationBell();});
  document.addEventListener('click',event=>{const host=document.getElementById('gax-notification-host');if(host&&!host.contains(event.target))gaxCloseNotifications();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')gaxCloseNotifications();});
}

function TrendChart() {
  const data = D.trends;
  const w = 600, h = 160, pad = { l: 32, r: 16, t: 16, b: 24 };
  const maxVal = 40;
  const xFor = i => pad.l + (i / (data.labels.length - 1)) * (w - pad.l - pad.r);
  const yFor = v => h - pad.b - (v / maxVal) * (h - pad.t - pad.b);
  const buildPath = (arr) => `M${arr.map((v, i) => `${xFor(i)},${yFor(v)}`).join(' L')}`;
  const grid = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = pad.t + f * (h - pad.t - pad.b);
    const v = Math.round(maxVal - f * maxVal);
    return `<line x1="${pad.l}" y1="${y}" x2="${w - pad.r}" y2="${y}" stroke="var(--chart-grid)" stroke-width="1" stroke-dasharray="2 4"/><text x="${pad.l - 8}" y="${y + 3}" text-anchor="end" font-size="9" fill="currentColor" opacity="0.45" font-family="Inter">${v}</text>`;
  }).join('');
  const labels = data.labels.map((d, i) => `<text x="${xFor(i)}" y="${h - 6}" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.5" font-family="Inter">${d}</text>`).join('');
  const hitZones = data.labels.map((d, i) => {
    const zw = (w - pad.l - pad.r) / data.labels.length;
    const zx = xFor(i) - zw / 2;
    const tip = `<div class="font-semibold text-sm">${d}</div><div class="mt-1 space-y-0.5 text-xs"><div><span class="inline-block h-2 w-2 rounded-full bg-emerald-500 mr-1"></span>Passing: ${data.passing[i]}</div><div><span class="inline-block h-2 w-2 rounded-full bg-rose-500 mr-1"></span>Failing: ${data.failing[i]}</div></div>`;
    return `<rect class="cursor-pointer hover:fill-slate-200/50 dark:hover:fill-slate-800/50" x="${zx}" y="${pad.t}" width="${zw}" height="${h - pad.t - pad.b}" fill="transparent" data-tooltip="${tip.replace(/"/g, '&quot;')}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full">${grid}<path d="${buildPath(data.passing)}" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="${buildPath(data.failing)}" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${data.passing.map((v, i) => `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="3" fill="var(--chart-dot-fill)" stroke="#10b981" stroke-width="2" pointer-events="none"/>`).join('')}${data.failing.map((v, i) => `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="3" fill="var(--chart-dot-fill)" stroke="#ef4444" stroke-width="2" pointer-events="none"/>`).join('')}${labels}${hitZones}</svg>`;
}

function VendorRiskDonut() {
  const total = D.vendorRisk.reduce((s, v) => s + v.count, 0);
  let offset = 25;
  const segments = D.vendorRisk.map(v => {
    const pct = (v.count / total) * 100;
    const stroke = v.color.includes('rose') ? '#ef4444' : v.color.includes('amber') ? '#f59e0b' : v.color.includes('emerald') ? '#10b981' : '#cbd5e1';
    const el = `<circle cx="50" cy="50" r="40" fill="none" stroke="${stroke}" stroke-width="12" stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="${offset}" transform="rotate(-90 50 50)" class="transition-all duration-300"/>`;
    offset -= pct;
    return el;
  }).join('');
  return `<div class="flex items-center gap-6">
    <div class="relative h-32 w-32 shrink-0"><svg viewBox="0 0 100 100" class="h-full w-full">${segments}</svg>
    <div class="absolute inset-0 flex flex-col items-center justify-center"><div class="tabular text-2xl font-semibold">${total}</div><div class="text-[10px] uppercase tracking-widest text-slate-400">Vendors</div></div></div>
    <div class="space-y-2 text-sm w-full">${D.vendorRisk.map(v => `<div class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded-full ${v.color}"></span><span class="text-slate-600 dark:text-slate-400">${v.label}</span><span class="ml-auto font-medium tabular">${v.count}</span></div>`).join('')}</div>
  </div>`;
}

function renderDashboard() {
  const controls = D.controls || [];
  const applicableControls = controls.filter(c => c.status !== 'NOT_APPLICABLE');
  const implemented = applicableControls.filter(c => c.status === 'IMPLEMENTED').length;
  const underReview = applicableControls.filter(c => c.status === 'UNDER_REVIEW').length;
  const openGaps = applicableControls.filter(c => c.status === 'NOT_IMPLEMENTED').length;
  const readinessPct = applicableControls.length ? Math.round((implemented / applicableControls.length) * 100) : 0;

  const frameworkList = FRAMEWORKS.filter(f => f.key !== 'all');
  const expectedRequirements = frameworkList.reduce((sum, f) => sum + (Number(f.expected) || 0), 0);
  const loadedRequirements = controls.length;
  const pendingCatalogue = Math.max(0, expectedRequirements - loadedRequirements);

  const risks = (D.risks || []).slice();
  const highRisks = risks.filter(r => Number(r.residual ?? r.inherent ?? 0) >= 16);
  const riskBands = [
    { label: 'Critical', count: risks.filter(r => Number(r.residual ?? r.inherent ?? 0) >= 20).length, color: 'bg-rose-600' },
    { label: 'High', count: risks.filter(r => Number(r.residual ?? r.inherent ?? 0) >= 16 && Number(r.residual ?? r.inherent ?? 0) < 20).length, color: 'bg-orange-500' },
    { label: 'Moderate', count: risks.filter(r => Number(r.residual ?? r.inherent ?? 0) >= 9 && Number(r.residual ?? r.inherent ?? 0) < 16).length, color: 'bg-amber-500' },
    { label: 'Low', count: risks.filter(r => Number(r.residual ?? r.inherent ?? 0) < 9).length, color: 'bg-emerald-500' }
  ];

  const auditState = gaxAuditLoad();
  const auditCount = (auditState.audits || []).length;
  const auditFindings = (auditState.findings || []).length;
  const auditRequests = (auditState.requests || []).length;
  const openAudits = (auditState.audits || []).filter(a => !/completed|closed|archived/i.test(String(a.status || a.stage || ''))).length;

  const privacyState = gaxPrivacyLoad();
  const privacyRecords = Object.values(privacyState).reduce((sum, value) => sum + (Array.isArray(value) ? value.length : 0), 0);
  const aiState = gaxAiLoad();
  const aiRecords = ['systems','impacts','incidents','approvals'].reduce((sum, key) => sum + (aiState[key] || []).length, 0);
  const evidenceCount = gaxEvidenceLoad().length + controls.reduce((sum, c) => sum + (Array.isArray(c.evidenceFiles) ? c.evidenceFiles.length : 0), 0);
  const monitorState = gaxMonitorLoad();
  const checks = monitorState.checks || [];
  const failedChecks = checks.filter(c => /fail/i.test(String(c.status || ''))).length;
  const notRunChecks = checks.filter(c => /not run|pending/i.test(String(c.status || ''))).length;

  const vendorList = D.vendors || [];
  const highVendors = vendorList.filter(v => ['High','Critical'].includes(v.risk)).length;
  const vendorsReview = vendorList.filter(v => /review/i.test(String(v.status || ''))).length;
  const policyList = loadPolicyLibrary();
  const policyReviewAlertHtml = gaxPolicyReviewAlertHtml(policyList);
  const policyAttention = policyList.filter(p => p.status !== 'Active').length;
  const missingPolicies = policyList.filter(p => ['Missing','Not Created'].includes(p.status)).length;
  const integrationList = D.integrations || [];
  const connectedIntegrations = integrationList.filter(i => i.connected).length;
  const disconnectedIntegrations = integrationList.length - connectedIntegrations;
  const actionList = D.tasks || [];

  const readinessRows = frameworkList.map(f => {
    const items = controls.filter(c => c.framework === f.key);
    const total = items.length;
    const applicable = items.filter(c => c.status !== 'NOT_APPLICABLE');
    const done = applicable.filter(c => c.status === 'IMPLEMENTED').length;
    const review = applicable.filter(c => c.status === 'UNDER_REVIEW').length;
    const notDone = applicable.filter(c => c.status === 'NOT_IMPLEMENTED').length;
    const pct = applicable.length ? Math.round(done / applicable.length * 100) : 0;
    const pending = Math.max(0, (Number(f.expected) || 0) - total);
    return { ...f, total, done, review, notDone, pct, pending };
  });

  const topRisks = risks.slice().sort((a,b) => Number(b.residual ?? b.inherent ?? 0) - Number(a.residual ?? a.inherent ?? 0)).slice(0,4);
  const priorityItems = [];
  actionList.slice(0,3).forEach(t => priorityItems.push({ title:t.title, meta:`${t.owner || 'Unassigned'} · Due ${t.due || 'Not set'}`, severity:t.severity || 'Open', target:/AI/i.test(t.title)?'#ai-governance':/policy/i.test(t.title)?'#policies':/evidence/i.test(t.title)?'#evidence':'#gaps' }));
  policyList.filter(p => ['Missing','Needs Approval','Renews Soon','Draft'].includes(p.status)).slice(0,2).forEach(p => priorityItems.push({ title:p.name, meta:`Policy lifecycle · ${p.status}`, severity:p.status === 'Missing' ? 'Critical' : 'Review', target:'#policies' }));
  if (failedChecks) priorityItems.push({ title:`${failedChecks} monitoring check${failedChecks===1?'':'s'} failing`, meta:'Continuous Control Monitoring', severity:'High', target:'#monitoring' });
  vendorList.filter(v => v.risk === 'High' || /review/i.test(String(v.status||''))).slice(0,1).forEach(v => priorityItems.push({ title:`Review ${v.name}`, meta:`Vendor risk · ${v.risk} · ${v.status}`, severity:'High', target:'#vendors' }));
  const visibleActions = priorityItems.slice(0,6);

  const riskTotal = Math.max(1, risks.length);
  const riskGradientParts = [];
  let angle = 0;
  const riskColors = ['#e11d48','#f97316','#f59e0b','#10b981'];
  riskBands.forEach((band, i) => {
    const next = angle + (band.count / riskTotal) * 360;
    if (band.count) riskGradientParts.push(`${riskColors[i]} ${angle}deg ${next}deg`);
    angle = next;
  });

// UNIFIED GAP ASSESSMENT — control inventory + questionnaire + mapping.
// The standalone Controls module has been consolidated here so there is
// one authoritative framework requirement inventory and one assessment path.
let gapFilter='all';
// Individual questionnaire modal. Framework-specific mode is deliberately isolated:
// only the selected framework's requirement/question is assessed. Crosswalks are
// displayed in the questionnaire only when it was opened from the All Frameworks view.
function openAssessment(framework,controlId,assessmentView='framework'){
  const c=D.controls.find(x=>x.framework===framework&&x.id===controlId);if(!c)return;
  const showCrossFrameworkMapping=assessmentView==='all';
  const mappings=c.mappingRefs?.length?c.mappingRefs.map(m=>`<div class="flex items-center justify-between gap-3 border-b border-slate-100 py-1.5 text-xs last:border-0 dark:border-slate-800"><span class="text-slate-600 dark:text-slate-300">${escapeHtml(m.framework)}</span><span class="font-mono font-semibold">${escapeHtml(m.id)}</span></div>`).join(''):'<div class="text-xs text-slate-400">No curated cross-framework mapping for this requirement.</div>';
  const scopePanel=showCrossFrameworkMapping
    ? `<div class="mb-4 rounded-xl border border-indigo-100 p-3 dark:border-indigo-900"><div class="mb-2 text-[10px] font-semibold uppercase tracking-widest text-indigo-600 dark:text-indigo-300">Related mapped requirements (informative)</div>${mappings}<p class="mt-2 text-[10px] leading-4 text-slate-400">These are cross-framework reference links only. Each mapped requirement must be assessed and evidenced separately; this questionnaire updates only ${escapeHtml(c.framework)} · ${escapeHtml(c.id)}.</p></div>`
    : `<div class="mb-4 rounded-xl border border-emerald-100 bg-emerald-50/70 p-3 dark:border-emerald-900 dark:bg-emerald-900/10"><div class="text-[10px] font-semibold uppercase tracking-widest text-emerald-700 dark:text-emerald-300">Framework-specific assessment</div><p class="mt-1 text-xs leading-5 text-slate-600 dark:text-slate-300">This questionnaire is limited to <strong>${escapeHtml(c.framework)}</strong>. It assesses only requirement <strong>${escapeHtml(c.id)}</strong> and does not include questions or requirements from other frameworks. Cross-framework mappings remain available in the All Frameworks view.</p></div>`;

function closeAssessment(){document.getElementById('gax-assessment-modal').innerHTML='';}
async function saveAssessment(framework,controlId){
  const c=D.controls.find(x=>x.framework===framework&&x.id===controlId);if(!c)return;
  const status=document.getElementById('gax-assessment-status').value;
  const notes=document.getElementById('gax-assessment-notes').value.trim();
  const ref=document.getElementById('gax-assessment-reference').value.trim();
  const owner=document.getElementById('gax-assessment-owner').value.trim();
  const file=document.getElementById('gax-assessment-file').files[0];
  if(status==='IMPLEMENTED'&&!notes&&!ref&&!file){toast('Add justification or an evidence reference before marking Implemented.');return;}
  if(status==='NOT_APPLICABLE'&&!notes){toast('Document the reason before marking Not Applicable.');return;}
  c.status=status;c.justification=notes;c.evidenceReference=ref;c.owner=owner||'—';
  if(file){
    try{const attachment=await storePolicyAttachment(`GAP::${framework}::${controlId}`,file);c.evidenceFiles=Array.isArray(c.evidenceFiles)?c.evidenceFiles:[];c.evidenceFiles.push(attachment);c.evidenceFileName=file.name;c.evidence=(c.evidence||0)+1;}
    catch(err){toast(err?.message||'Evidence file could not be saved.');return;}
  }
  else if(ref||notes)c.evidence=Math.max(c.evidence||0,1);
  c.lastTested=new Date().toLocaleDateString();
  persistAssessments();closeAssessment();toast('Assessment saved locally for this requirement.');route();
}

function exportGapRegister(){
  const cols=['Framework','Requirement ID','Requirement','Family','Status','Owner','Justification','Evidence Reference','Evidence File','Mapped Requirements'];
  const rows=D.controls.map(c=>[c.framework,c.id,c.name,c.family||'',statusLabel(c.status),c.owner||'',c.justification||'',c.evidenceReference||'',c.evidenceFileName||'',(c.mappingRefs||[]).map(m=>`${m.framework}:${m.id}`).join(' | ')]);
  const csv=[cols,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='GRCalphaX_Gap_Assessment_Register.csv';a.click();URL.revokeObjectURL(url);
}

async function persistPolicyLibrary(){
  D.policies=policyRecords;
  const snapshot=JSON.parse(JSON.stringify(policyRecords));
  let localSaved=false, indexedDbSaved=false, localError=null, idbError=null;
  try{ localStorage.setItem(POLICY_STORAGE_KEY,JSON.stringify(snapshot)); localSaved=true; }
  catch(e){ localError=e; console.warn('Policy library localStorage write failed',e); }
  try{ await savePolicyCatalogToIndexedDB(snapshot); indexedDbSaved=true; }
  catch(e){ idbError=e; console.warn('Policy library IndexedDB write failed',e); }
  if(localSaved||indexedDbSaved) return true;

}
async function hydratePolicyLibraryFromIndexedDB(){

    const savedByName=new Map(saved.map(p=>[policyNormaliseName(p.name),p]));

      const prior=savedById.get(String(base.id||''))||savedByName.get(policyNormaliseName(base.name));
      return prior?{...base,...prior}:base;
    });

  }catch(err){ console.warn('Could not restore Policy Library catalogue from IndexedDB',err); }
}

// Policy document and catalogue persistence. IndexedDB stores the original file Blob and
// the catalogue snapshot; localStorage remains a compatibility copy for older builds.
const POLICY_ATTACHMENT_DB='gax-policy-document-store-v1';
const POLICY_ATTACHMENT_STORE='policyFiles';
const POLICY_CATALOG_STORE='policyCatalog';
const POLICY_ATTACHMENT_MAX_BYTES=25*1024*1024;
const POLICY_ATTACHMENT_MAX_COUNT=10;
const POLICY_ATTACHMENT_LOCAL_FALLBACK_MAX_BYTES=1500*1024;
const POLICY_ATTACHMENT_FALLBACK_KEY='gax-policy-attachment-fallback-v1';
const POLICY_ATTACHMENT_EXTENSIONS=new Set(['pdf','doc','docx','docm','odt','rtf','txt','csv','xls','xlsx','xlsm','ppt','pptx','pptm','ods','odp']);
function openPolicyAttachmentDb(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB) return reject(new Error('IndexedDB is unavailable in this browser context.'));
    let request;
    try { request=indexedDB.open(POLICY_ATTACHMENT_DB,2); }
    catch(err){ reject(new Error(`Could not open browser document storage: ${err.message||err}`)); return; }
    request.onupgradeneeded=()=>{
      const db=request.result;
      if(!db.objectStoreNames.contains(POLICY_ATTACHMENT_STORE)) db.createObjectStore(POLICY_ATTACHMENT_STORE,{keyPath:'id'});
      if(!db.objectStoreNames.contains(POLICY_CATALOG_STORE)) db.createObjectStore(POLICY_CATALOG_STORE,{keyPath:'key'});
    };
    request.onsuccess=()=>{ const db=request.result; db.onversionchange=()=>db.close(); resolve(db); };
    request.onerror=()=>reject(request.error||new Error('Could not initialise browser document storage.'));
    request.onblocked=()=>reject(new Error('Browser document storage is busy in another tab. Close other GRCAlphaX tabs and retry.'));
  });
}
function idbRequestResult(request){
  return new Promise((resolve,reject)=>{ request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error||new Error('Browser storage request failed.')); });
}
function idbTransactionDone(tx){
  return new Promise((resolve,reject)=>{ tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error||new Error('Browser storage transaction failed.')); tx.onabort=()=>reject(tx.error||new Error('Browser storage transaction was cancelled.')); });
}
function makePolicyAttachmentId(){ return `PATT-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`; }
function readFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onload=()=>resolve(String(reader.result||'')); reader.onerror=()=>reject(reader.error||new Error('Could not read the selected file.')); reader.readAsDataURL(file); });
}
function readPolicyAttachmentFallback(){
  try { const v=JSON.parse(localStorage.getItem(POLICY_ATTACHMENT_FALLBACK_KEY)||'[]'); return Array.isArray(v)?v:[]; }
  catch(_){ return []; }
}
async function storePolicyAttachment(recordId,file){
  const attachmentId=makePolicyAttachmentId();
  const uploadedAt=new Date().toISOString();
  const meta={id:attachmentId,name:file.name,type:file.type||'application/octet-stream',size:file.size,uploadedAt};
  let db;
  try{
    db=await openPolicyAttachmentDb();
    const tx=db.transaction(POLICY_ATTACHMENT_STORE,'readwrite');
    const done=idbTransactionDone(tx);
    tx.objectStore(POLICY_ATTACHMENT_STORE).put({id:attachmentId,recordId,name:file.name,type:meta.type,size:file.size,uploadedAt,blob:file.slice(0,file.size,meta.type)});
    await done;
    return {...meta,storage:'IndexedDB'};
  }catch(idbError){
    console.warn('IndexedDB attachment save failed; trying small-file fallback.',idbError);
    if(file.size>POLICY_ATTACHMENT_LOCAL_FALLBACK_MAX_BYTES){
      throw new Error(`The browser could not save this file to IndexedDB (${idbError.message||'storage unavailable'}). For a safe fallback, files must be 1.5 MB or smaller. Reopen GRCAlphaX in Chrome/Edge using a local web server or hosted HTTPS page and retry.`);
    }
    try{
      const dataUrl=await readFileAsDataUrl(file);
      const fallback=readPolicyAttachmentFallback();
      fallback.push({id:attachmentId,recordId,name:file.name,type:meta.type,size:file.size,uploadedAt,dataUrl});
      localStorage.setItem(POLICY_ATTACHMENT_FALLBACK_KEY,JSON.stringify(fallback));
      return {...meta,storage:'Browser fallback'};
    }catch(fallbackError){
      throw new Error(`The attachment could not be saved. IndexedDB: ${idbError.message||idbError}. Local fallback: ${fallbackError.message||fallbackError}.`);
    }
  }finally{ if(db) db.close(); }
}
async function savePolicyCatalogToIndexedDB(records){
  const db=await openPolicyAttachmentDb();
  try{
    const tx=db.transaction(POLICY_CATALOG_STORE,'readwrite');
    const done=idbTransactionDone(tx);
    tx.objectStore(POLICY_CATALOG_STORE).put({key:'records',records:JSON.parse(JSON.stringify(records)),updatedAt:new Date().toISOString()});
    await done;
  }finally{ db.close(); }
}
async function readPolicyCatalogFromIndexedDB(){
  const db=await openPolicyAttachmentDb();
  try{
    const tx=db.transaction(POLICY_CATALOG_STORE,'readonly');
    const item=await idbRequestResult(tx.objectStore(POLICY_CATALOG_STORE).get('records'));
    return Array.isArray(item?.records)?item.records:null;
  }finally{ db.close(); }
}
async function deletePolicyAttachment(attachmentId){
  let db;
  try{
    try{
      db=await openPolicyAttachmentDb();
      const tx=db.transaction(POLICY_ATTACHMENT_STORE,'readwrite');
      const done=idbTransactionDone(tx);
      tx.objectStore(POLICY_ATTACHMENT_STORE).delete(attachmentId);
      await done;
    }catch(err){ console.warn('IndexedDB attachment cleanup skipped',err); }
  }finally{ if(db) db.close(); }
  try{ localStorage.setItem(POLICY_ATTACHMENT_FALLBACK_KEY,JSON.stringify(readPolicyAttachmentFallback().filter(x=>x.id!==attachmentId))); }catch(_){}
}
async function downloadPolicyAttachment(attachmentId){
  const signedIn=gaxAuthCurrentUser();
  if(signedIn?.role==='AUDITOR' && !gaxAuditorCanDownloadAttachment(attachmentId)){toast('Access denied: this file is not part of your approved auditor assignment.');return;}
  let item=null;
  try{
    let db;
    try{
      db=await openPolicyAttachmentDb();
      const tx=db.transaction(POLICY_ATTACHMENT_STORE,'readonly');
      item=await idbRequestResult(tx.objectStore(POLICY_ATTACHMENT_STORE).get(attachmentId));
    }catch(idbErr){ console.warn('IndexedDB read unavailable; checking browser fallback',idbErr); }
    finally{ if(db) db.close(); }
    if(item?.blob){
      const url=URL.createObjectURL(item.blob); const a=document.createElement('a'); a.href=url; a.download=item.name||'policy-document'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500); return;
    }
    const fallback=readPolicyAttachmentFallback().find(x=>x.id===attachmentId);
    if(fallback?.dataUrl){ const a=document.createElement('a'); a.href=fallback.dataUrl; a.download=fallback.name||'policy-document'; document.body.appendChild(a); a.click(); a.remove(); return; }
    toast('Attachment file was not found in this browser. It may have been cleared from browser storage.');
  }catch(err){ console.error('Policy attachment download failed',err); toast(err?.message||'Could not retrieve the policy document from browser storage.'); }
}
function validatePolicyFiles(files){

    const ext=(file.name.split('.').pop()||'').toLowerCase();
    if(!POLICY_ATTACHMENT_EXTENSIONS.has(ext)) return `File type .${ext||'(unknown)'} is not supported. Use PDF, Word, Excel, PowerPoint, ODT, RTF, CSV or TXT.`;
    if(file.size>POLICY_ATTACHMENT_MAX_BYTES) return `${file.name} exceeds the 25 MB per-file limit.`;

async function saveNewPolicy(event){
  if(event?.preventDefault) event.preventDefault();
  const form=event?.currentTarget||document.getElementById('new-policy-form');
  if(!form) return;
  const fd=new FormData(form); const mode=String(fd.get('targetMode')||'new');
  const fileInput=form.querySelector('[name="attachments"]');
  const files=Array.from(fileInput?.files||[]);
  const fileError=validatePolicyFiles(files);
  if(fileError){ setPolicySaveFeedback(fileError); toast(fileError); return; }
  if(mode==='existing'&&!files.length){ const msg='Choose at least one policy document before attaching it.'; setPolicySaveFeedback(msg); toast(msg); return; }
  if(files.length>POLICY_ATTACHMENT_MAX_COUNT){ const msg=`Choose no more than ${POLICY_ATTACHMENT_MAX_COUNT} files.`; setPolicySaveFeedback(msg); toast(msg); return; }
  const submit=document.getElementById('policy-form-submit');
  if(submit){submit.disabled=true;submit.textContent='Saving document…';}
  const newlyStored=[];
  try{
    const today=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    if(mode==='existing'){
      const recordId=String(fd.get('existingPolicyId')||'');
      const rec=loadPolicyLibrary().find(p=>p.id===recordId);
      if(!rec) throw new Error('Select a valid policy from the catalogue.');
      const metadata=[];
      for(const file of files){
        setPolicySaveFeedback(`Saving ${file.name}…`,'success');
        const meta=await storePolicyAttachment(rec.id,file); newlyStored.push(meta.id); metadata.push(meta);
      }
      rec.attachments=[...(Array.isArray(rec.attachments)?rec.attachments:[]),...metadata];
      if(['Missing','Not Created'].includes(rec.status)) rec.status='Under Review';
      rec.updated=today;
      if(!(await persistPolicyLibrary())) throw new Error('The document was stored, but the policy record could not be saved. Check browser storage availability and retry.');
      closePolicyModal(); renderPolicies(); toast(`${metadata.length} document${metadata.length===1?'':'s'} attached to ${rec.name} and saved.`); return;
    }
    const name=String(fd.get('name')||'').trim();
    const frameworks=fd.getAll('frameworks').map(String);
    if(!name) throw new Error('Enter a policy name.');
    if(!frameworks.length) throw new Error('Select at least one framework.');
    const duplicate=loadPolicyLibrary().find(p=>policyNormaliseName(p.name)===policyNormaliseName(name));
    if(duplicate) throw new Error(`“${duplicate.name}” already exists. Choose “Upload / attach a document to an existing policy name” to add its file.`);
    const rec={id:`POL-C-${Date.now().toString(36).toUpperCase()}`,name,category:String(fd.get('category')||'Policy'),frameworks,framework:frameworks.join(', '),basis:String(fd.get('basis')||'Control-derived'),references:String(fd.get('references')||'').trim(),purpose:'Custom policy record created in the Policy Library.',owner:String(fd.get('owner')||'').trim()||'Unassigned',version:String(fd.get('version')||'1.0').trim()||'1.0',status:String(fd.get('status')||'Draft'),updated:today,reviewDate:String(fd.get('reviewDate')||''),content:String(fd.get('content')||'').trim(),attachments:[],custom:true};
    for(const file of files){
      setPolicySaveFeedback(`Saving ${file.name}…`,'success');
      const meta=await storePolicyAttachment(rec.id,file); newlyStored.push(meta.id); rec.attachments.push(meta);
    }
    policyRecords.unshift(rec);
    if(!(await persistPolicyLibrary())){
      policyRecords=policyRecords.filter(p=>p.id!==rec.id);
      throw new Error('The policy document was stored, but the policy catalogue could not be saved. Check browser storage availability and retry.');
    }
    closePolicyModal(); renderPolicies(); toast(files.length?`Policy created with ${files.length} attached document${files.length===1?'':'s'} and saved.`:'Policy created and saved to the Policy Library.');
  }catch(err){
    console.error('Policy document save failed',err);
    for(const id of newlyStored) await deletePolicyAttachment(id).catch(()=>{});
    const message=err?.message||'Could not save the policy document. Please try again or use a smaller file.';
    setPolicySaveFeedback(message,'error'); toast(message);
  }finally{
    const currentSubmit=document.getElementById('policy-form-submit');
    if(currentSubmit){ currentSubmit.disabled=false; currentSubmit.textContent=mode==='existing'?'Attach document':'Save policy'; }
  }
}

function restoreRiskManagement(){
  try{
    const saved=JSON.parse(localStorage.getItem(RISK_STORAGE_KEY)||'{}');
    D.risks=Array.isArray(saved.risks)&&saved.risks.length?saved.risks:RISK_DEFAULT_DETAILS.map(r=>({...r}));
    riskAssessments=Array.isArray(saved.assessments)?saved.assessments:[];
    riskTreatments=Array.isArray(saved.treatments)?saved.treatments:[];
    riskAcceptances=Array.isArray(saved.acceptances)?saved.acceptances:[];
    if(saved.governance&&typeof saved.governance==='object') riskGovernance={...riskGovernance,...saved.governance};
  }catch(e){D.risks=RISK_DEFAULT_DETAILS.map(r=>({...r}));riskAssessments=[];riskTreatments=[];riskAcceptances=[];console.warn('Risk management data could not be restored',e);}
}
function persistRiskManagement(){
  try{localStorage.setItem(RISK_STORAGE_KEY,JSON.stringify({risks:D.risks,assessments:riskAssessments,treatments:riskTreatments,acceptances:riskAcceptances,governance:riskGovernance}));}
  catch(e){toast('Could not save risk data in this browser');console.warn(e);}
}
restoreRiskManagement();

function riskRating(score){return score>=20?'Critical':score>=13?'High':score>=7?'Moderate':'Low';}
function riskRatingClass(score){return score>=20?'bg-rose-50 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300':score>=13?'bg-orange-50 text-orange-700 dark:bg-orange-900/40 dark:text-orange-300':score>=7?'bg-amber-50 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300':'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300';}

function riskAddAcceptance(event){

  const decision=String(data.get('decision')||'Pending Approval');const approver=String(data.get('approver')||'').trim();const approvalDate=String(data.get('approvalDate')||'');const rationale=String(data.get('rationale')||'').trim();

function riskSetAcceptanceDecision(id,decision){
  const item=riskAcceptances.find(a=>a.id===id);if(!item)return;
  const rationale=prompt(`Enter approval / rejection rationale for ${item.id}:`,item.rationale||'');if(rationale===null)return;
  item.decision=decision;item.rationale=rationale;item.decisionUpdatedAt=new Date().toISOString();
  const risk=D.risks.find(r=>r.id===item.riskId);if(risk){if(decision==='Accepted'){risk.stage='Accepted';risk.acceptedBy=item.approver||'Authorised approver';risk.acceptedAt=new Date().toISOString().slice(0,10);risk.acceptanceRationale=rationale;}else if(risk.stage==='Accepted'){risk.stage='Mitigating';}}
  persistRiskManagement();renderRisks();toast(`Risk acceptance marked ${decision.toLowerCase()}`);
}

const GAX_VENDOR_STORAGE='gax-vendor-reviews-v1';

function gaxVendorLoad(){

  try{gaxVendorState=JSON.parse(localStorage.getItem(GAX_VENDOR_STORAGE)||'null');}catch(_){gaxVendorState=null;}
  if(!gaxVendorState||!Array.isArray(gaxVendorState.vendors))gaxVendorState={vendors:D.vendors.map((v,i)=>({...v,id:`VND-${String(i+1).padStart(3,'0')}`})),reviews:[]};
  const known=new Set(gaxVendorState.vendors.map(v=>v.name));
  D.vendors.forEach((v,i)=>{if(!known.has(v.name))gaxVendorState.vendors.push({...v,id:`VND-BASE-${i+1}`});});
  return gaxVendorState;
}

function gaxAuditorCurrentUser(){
  const user=gaxAuthCurrentUser();
  return user&&user.role==='AUDITOR'?user:null;
}
function gaxAuditorCanViewPolicy(policyId){
  const user=gaxAuditorCurrentUser();
  if(!user) return false;
  const policy=loadPolicyLibrary().find(p=>String(p.id)===String(policyId));
  if(!policy) return false;
  return gaxAdminActiveGrants().some(g=>{
    if(!gaxAuditorIdentityMatches(g,user)) return false;
    if(g.scopeType==='POLICY' && String(g.policyId)===String(policy.id)) return true;
    if(g.scopeType==='FILE' && String(g.policyId)===String(policy.id)) return true;
    if(g.scopeType==='FOLDER' && String(g.folderCategory||'')===String(policy.category||'Uncategorised')) return true;
    return false;
  });
}
function gaxAuditorAllowedAttachments(policy){
  const user=gaxAuditorCurrentUser();
  if(!user||!policy) return [];
  const grants=gaxAdminActiveGrants().filter(g=>gaxAuditorIdentityMatches(g,user));
  const attachments=Array.isArray(policy.attachments)?policy.attachments:[];
  return attachments.filter(a=>grants.some(g=>{
    if(g.scopeType==='FILE') return String(g.attachmentId)===String(a.id) && String(g.policyId)===String(policy.id);
    if(g.scopeType==='POLICY') return String(g.policyId)===String(policy.id);
    if(g.scopeType==='FOLDER') return String(g.folderCategory||'')===String(policy.category||'Uncategorised');
    return false;
  }));
}
function gaxAuditorCanDownloadAttachment(attachmentId){
  const user=gaxAuditorCurrentUser();
  if(!user) return false;
  const policy=loadPolicyLibrary().find(p=>(Array.isArray(p.attachments)?p.attachments:[]).some(a=>String(a.id)===String(attachmentId)));
  if(!policy) return false;
  return gaxAuditorAllowedAttachments(policy).some(a=>String(a.id)===String(attachmentId));
}
function gaxAuditorDownloadAttachment(attachmentId){
  if(!gaxAuditorCanDownloadAttachment(attachmentId)){toast('This file is not included in your approved auditor access.');return;}
  downloadPolicyAttachment(attachmentId);
}

function gaxAdminLoad(){

    const raw=localStorage.getItem(GAX_ADMIN_STORAGE_KEY);

      const parsed=JSON.parse(raw);
      if(parsed && Array.isArray(parsed.users) && Array.isArray(parsed.requests) && Array.isArray(parsed.grants) && Array.isArray(parsed.log)){
        gaxAdminState=parsed;

        // The stable user ID is intentionally preserved so an existing PBKDF2 credential remains valid.
        const legacySeedAdmin = gaxAdminState.users.find(u => u.role==='SUPER_ADMIN' && (
          String(u.username||'').toLowerCase()==='sarah.chen' ||
          String(u.email||'').toLowerCase()==='sarah.chen@cynera.example' ||
          (String(u.id)==='USR-001' && String(u.name||'').toLowerCase()==='sarah chen')
        ));
        if(legacySeedAdmin){
          const targetUsername='kamlesh.joshi';
          const usernameConflict=gaxAdminState.users.find(u=>u.id!==legacySeedAdmin.id&&String(u.username||'').toLowerCase()===targetUsername);
          if(!usernameConflict){
            legacySeedAdmin.name='Kamlesh Joshi';
            legacySeedAdmin.username=targetUsername;
            if(String(legacySeedAdmin.email||'').toLowerCase()==='sarah.chen@cynera.example' || !legacySeedAdmin.email){

            }
            legacySeedAdmin.jobTitle='Super Administrator';
            legacySeedAdmin.department=legacySeedAdmin.department||'Administration';
            // Keep the same user ID: login credentials and current session remain attached to this account.
            try{
              const recoveryKey='gax-local-auth-reset-requests-v1';
              const recovery=JSON.parse(localStorage.getItem(recoveryKey)||'[]');
              if(Array.isArray(recovery)){
                recovery.forEach(r=>{if(r.userId===legacySeedAdmin.id){r.name=legacySeedAdmin.name;r.username=legacySeedAdmin.username;r.email=legacySeedAdmin.email;}});
                localStorage.setItem(recoveryKey,JSON.stringify(recovery));
              }
            }catch(_migrationError){console.warn('Password recovery profile migration skipped',_migrationError);}
          } else {
            legacySeedAdmin.name='Kamlesh Joshi';
            if(String(legacySeedAdmin.email||'').toLowerCase()==='sarah.chen@cynera.example') legacySeedAdmin.email='kamlesh.joshi@cynera.example';
            console.warn('The requested Super Admin username kamlesh.joshi is already assigned to another account; resolve the duplicate in Administrator → Users.');
          }
        }
        if(!Array.isArray(gaxAdminState.tasks)) gaxAdminState.tasks=[];
        if(!gaxAdminState.organisationName) gaxAdminState.organisationName='CYNERA Security';
        // Migrate the old demo organisation label without overwriting a real organisation name.
        if(String(gaxAdminState.organisationName).trim().toLowerCase()==='acme corp') gaxAdminState.organisationName='CYNERA Security';
        // Replace only the old seeded placeholder email domain; preserve user-entered addresses.
        gaxAdminState.users.forEach(u=>{ if(typeof u.email==='string' && u.email.toLowerCase().endsWith('@acme.example')) u.email=u.email.replace(/@acme\.example$/i,'@cynera.example'); });
        gaxAdminState.users.forEach(u=>{
          if(!u.username) u.username=String(u.email||'').split('@')[0] || String(u.id||'user').toLowerCase();
          if(u.jobTitle===undefined) u.jobTitle='';
          if(u.department===undefined) u.department='';
          if(u.phone===undefined) u.phone='';
        });
        // Persist the migrated organisation label and seeded demo email domain.
        localStorage.setItem(GAX_ADMIN_STORAGE_KEY, JSON.stringify(gaxAdminState));
      }
    }
  }catch(err){console.warn('Administrator data could not be loaded',err);}

  return gaxAdminState;
}

  const user=s.users.find(u=>u.id===r.auditorId&&u.role==='AUDITOR'&&u.status==='Active');
  if(!user){toast('The requesting auditor is no longer active.');return;}
  const grantedAt=new Date(),expiresAt=new Date(grantedAt.getTime()+r.requestedDays*86400000);
  r.status='Approved';r.reviewedAt=grantedAt.toISOString();r.reviewedBy=gaxAdminCurrentActorName();r.accessMode='VIEW_ONLY';r.grantId=`GRANT-${Date.now()}`;
  s.grants.unshift({id:r.grantId,requestId:r.id,auditorId:r.auditorId,auditorName:r.auditorName,auditorEmail:r.auditorEmail,documentName:r.documentName,framework:r.framework,purpose:r.purpose,accessMode:'VIEW_ONLY',grantedAt:grantedAt.toISOString(),expiresAt:expiresAt.toISOString(),status:'Active'});

}
function gaxAdminRejectRequest(requestId){

function gaxAdminRevokeGrant(grantId){

}

function gaxAdminSubmitRequest(event){
  event.preventDefault();
  const form=event.currentTarget,fd=new FormData(form),s=gaxAdminLoad();
  const auditorId=String(fd.get('auditorId')||''),scopeRef=String(fd.get('scopeRef')||''),purpose=String(fd.get('purpose')||'').trim(),days=Math.max(1,Math.min(90,Number(fd.get('days')||7)));
  const auditor=s.users.find(u=>u.id===auditorId&&u.role==='AUDITOR'&&u.status==='Active');
  const taskTitle=String(fd.get('taskTitle')||'').trim();
  if(!auditor||!scopeRef||!purpose){toast('Select an active auditor, an assignment type, and a business purpose.');return;}
  const parts=scopeRef.split('|'),scopeType=parts[0];
  let policyId='',attachmentId='',folderCategory='',documentName='',framework='';
  const library=loadPolicyLibrary();
  if(scopeType==='FILE'){
    policyId=parts[1]||'';attachmentId=parts[2]||'';
    const policy=library.find(p=>String(p.id)===policyId);
    const attachment=policy?.attachments?.find(a=>String(a.id)===attachmentId);
    if(!policy||!attachment){toast('The selected document file is no longer available in the Policy Library.');return;}
    documentName=`${policy.name} — ${attachment.name}`;framework=(policy.frameworks||[]).map(policyFrameworkLabel).join(', ');
  }else if(scopeType==='POLICY'){
    policyId=parts[1]||'';
    const policy=library.find(p=>String(p.id)===policyId);
    if(!policy){toast('Select a valid policy record.');return;}
    documentName=policy.name;framework=(policy.frameworks||[]).map(policyFrameworkLabel).join(', ');
  }else if(scopeType==='FOLDER'){
    folderCategory=parts.slice(1).join('|');
    if(!folderCategory){toast('Select a valid policy folder.');return;}
    const matches=library.filter(p=>String(p.category||'Uncategorised')===folderCategory);
    if(!matches.length){toast('The selected folder is empty.');return;}
    documentName=`Policy folder: ${folderCategory}`;
    framework=[...new Set(matches.flatMap(p=>p.frameworks||[]).map(policyFrameworkLabel))].join(', ');
  }else if(scopeType==='TASK_ONLY'){
    if(!taskTitle){toast('Enter a task title for a task-only assignment.');return;}
    documentName=`Task only: ${taskTitle}`;
    framework=String(fd.get('framework')||'').trim();
  }else{toast('Unsupported access scope.');return;}
  const taskDueDate=String(fd.get('taskDueDate')||'').trim();
  const taskInstructions=String(fd.get('taskInstructions')||'').trim();
  const req={id:`REQ-${Date.now()}`,auditorId,auditorName:auditor.name,auditorEmail:auditor.email,scopeType,policyId,attachmentId,folderCategory,documentName,framework,purpose,requestedDays:days,taskTitle,taskDueDate,taskInstructions,requestedAt:new Date().toISOString(),status:'Pending'};
  s.requests.unshift(req);
  gaxAdminLog('Auditor access assignment submitted',`${auditor.name}: ${documentName}${taskTitle?`; task: ${taskTitle}`:''}; awaiting approval.`);
  if(gaxAdminSave()){form.reset();toast('Specific document/folder assignment submitted for approval.');renderAdministrator();}
}
function gaxAdminApproveRequest(requestId){
  const s=gaxAdminLoad(),r=s.requests.find(x=>x.id===requestId);if(!r||r.status!=='Pending')return;
  const user=s.users.find(u=>u.id===r.auditorId&&u.role==='AUDITOR'&&u.status==='Active');
  if(!user){toast('The assigned auditor is no longer active.');return;}
  const grantedAt=new Date(),expiresAt=new Date(grantedAt.getTime()+r.requestedDays*86400000);
  r.status='Approved';r.reviewedAt=grantedAt.toISOString();r.reviewedBy=gaxAdminCurrentActorName();r.accessMode='VIEW_ONLY';r.grantId=`GRANT-${Date.now()}`;
  let grant=null;
  if(r.scopeType!=='TASK_ONLY'){
    grant={id:r.grantId,requestId:r.id,auditorId:r.auditorId,auditorName:r.auditorName,auditorEmail:r.auditorEmail,scopeType:r.scopeType||'NAMED',policyId:r.policyId||'',attachmentId:r.attachmentId||'',folderCategory:r.folderCategory||'',documentName:r.documentName,framework:r.framework,purpose:r.purpose,accessMode:'VIEW_ONLY',grantedAt:grantedAt.toISOString(),expiresAt:expiresAt.toISOString(),status:'Active'};
    s.grants.unshift(grant);
  }else{r.grantId='';}
  if(r.taskTitle){
    if(!Array.isArray(s.tasks))s.tasks=[];
    const task={id:`ATASK-${Date.now()}`,requestId:r.id,grantId:grant?.id||'',auditorId:r.auditorId,auditorEmail:r.auditorEmail||user.email,auditorName:r.auditorName,title:r.taskTitle,framework:r.framework,dueDate:r.taskDueDate||'',instructions:r.taskInstructions||`Review ${r.documentName} for the assigned audit scope.`,status:'Assigned',assignedAt:grantedAt.toISOString(),assignedBy:gaxAdminCurrentActorName()};
    s.tasks.unshift(task);
    r.taskId=task.id;
  }
  gaxAdminLog('Auditor assignment approved',r.scopeType==='TASK_ONLY'?`${r.auditorName} assigned task “${r.taskTitle}” without document access.`:`${r.auditorName} granted read-only access to ${r.documentName} until ${expiresAt.toLocaleString()}${r.taskTitle?`; assigned task: ${r.taskTitle}`:''}.`);
  if(gaxAdminSave()){toast(r.scopeType==='TASK_ONLY'?'Auditor task assigned without document access.':'Read-only document access granted and task assigned where specified.');renderAdministrator();}
}

function gaxAuthLoadCredentials(){
  try{
    const parsed=JSON.parse(localStorage.getItem(GAX_AUTH_STORAGE_KEY)||'{}');
    return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{};
  }catch(err){console.warn('Local login credentials could not be read',err);return {};}
}
function gaxAuthSaveCredentials(records){
  try{localStorage.setItem(GAX_AUTH_STORAGE_KEY,JSON.stringify(records));return true;}
  catch(err){console.error('Local login credentials could not be saved',err);toast('Could not save login details. Check browser storage settings.');return false;}
}
function gaxAuthCurrentUser(){
  try{

function gaxAuthBase64ToBytes(value){const binary=atob(value);return Uint8Array.from(binary,c=>c.charCodeAt(0));}
async function gaxAuthHashPassword(password){
  if(!window.crypto?.subtle||!window.crypto?.getRandomValues)throw new Error('Secure browser cryptography is unavailable. Open this file in a current Chrome or Edge browser.');
  const salt=window.crypto.getRandomValues(new Uint8Array(16));
  const key=await window.crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
  const bits=await window.crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},key,256);

}
async function gaxAuthVerifyPassword(password,record){
  if(!record||record.algorithm!=='PBKDF2-SHA256'||!window.crypto?.subtle)return false;
  const salt=gaxAuthBase64ToBytes(record.salt);
  const key=await window.crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await window.crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:record.iterations||210000,hash:'SHA-256'},key,256));

async function gaxAuthBootstrapAdmin(event){
  event.preventDefault();gaxAuthErrorMessage='';
  const fd=new FormData(event.currentTarget),username=String(fd.get('username')||'').trim().toLowerCase(),password=String(fd.get('password')||''),confirm=String(fd.get('confirmPassword')||'');
  const admin=gaxAdminLoad().users.find(u=>u.role==='SUPER_ADMIN'&&u.status==='Active');
  if(!admin||username!==String(admin.username||'').toLowerCase()){gaxAuthErrorMessage='The active Super Admin account could not be verified. Review Administrator → Users.';renderLogin();return;}
  if(password.length<12){gaxAuthErrorMessage='Use a password with at least 12 characters.';renderLogin();return;}
  if(password!==confirm){gaxAuthErrorMessage='The password and confirmation do not match.';renderLogin();return;}
  const records=gaxAuthLoadCredentials();if(Object.keys(records).length){gaxAuthErrorMessage='Login setup has already been completed. Please sign in.';renderLogin();return;}
  try{
    records[admin.id]=await gaxAuthHashPassword(password);
    if(!gaxAuthSaveCredentials(records))return;
    sessionStorage.setItem(GAX_AUTH_SESSION_KEY,admin.id);
    gaxAdminLog('Initial login configured','Local Super Admin login was configured for this browser.',admin.name);gaxAdminSave();
    toast('Super Admin login created.');location.hash='#';route();
  }catch(err){gaxAuthErrorMessage=err.message||'Could not create login credentials.';renderLogin();}
}
async function gaxAuthLogin(event){
  event.preventDefault();gaxAuthErrorMessage='';
  const fd=new FormData(event.currentTarget),username=String(fd.get('username')||'').trim().toLowerCase(),password=String(fd.get('password')||'');
  const s=gaxAdminLoad(),user=s.users.find(u=>String(u.username||'').toLowerCase()===username&&u.status==='Active');
  const record=user?gaxAuthLoadCredentials()[user.id]:null;
  if(!user||!record){gaxAuthErrorMessage='Login failed. Check your username and ask the Super Admin to enable your account login.';renderLogin();return;}
  try{
    if(!await gaxAuthVerifyPassword(password,record)){gaxAuthErrorMessage='Login failed. Check your username and password.';renderLogin();return;}
    sessionStorage.setItem(GAX_AUTH_SESSION_KEY,user.id);
    gaxAdminLog('User logged in',`${user.name} signed in to this browser session.`,user.name);gaxAdminSave();
    toast(`Welcome, ${user.name}.`);location.hash=user.role==='AUDITOR'?'#auditor-workspace':'#';route();
  }catch(err){gaxAuthErrorMessage=err.message||'Could not verify login. Please use a current Chrome or Edge browser.';renderLogin();}
}

async function gaxAuthSaveProvisionedPassword(event){

 else fields=`<label class="block text-xs font-medium">AI system<select name="systemId" class="mt-1 w-full rounded-lg border p-2 text-sm dark:border-slate-700 dark:bg-slate-950">${s.systems.map(x=>`<option value="${escapeHtml(x.id)}">${escapeHtml(x.name)}</option>`).join('')}</select></label><label class="block text-xs font-medium">Approval gate<input name="name" required class="mt-1 w-full rounded-lg border p-2 text-sm dark:border-slate-700 dark:bg-slate-950" placeholder="e.g. Pre-production validation"></label><label class="block text-xs font-medium">Approver<input name="owner" class="mt-1 w-full rounded-lg border p-2 text-sm dark:border-slate-700 dark:bg-slate-950"></label><label class="block text-xs font-medium">Conditions / required evidence<textarea name="details" rows="3" class="mt-1 w-full rounded-lg border p-2 text-sm dark:border-slate-700 dark:bg-slate-950"></textarea></label>`;

// CUSTOM FRAMEWORK BUILDER: organisation-defined frameworks and individual requirements.
function gaxFrameworkSaveNew(event){event.preventDefault();const f=new FormData(event.target),name=String(f.get('name')||'').trim(),version=String(f.get('version')||'').trim();if(!name){toast('Enter a framework name.');return;}gaxLoadCustomFrameworks();if(FRAMEWORKS.some(x=>x.key.toLowerCase()===name.toLowerCase())){toast('A framework with this name already exists.');return;}const item={id:`CF-${Date.now()}`,name,version,description:String(f.get('description')||''),requirements:[],createdAt:new Date().toISOString()};gaxCustomFrameworks.push(item);localStorage.setItem(GAX_CUSTOM_FRAMEWORKS_KEY,JSON.stringify(gaxCustomFrameworks));FRAMEWORKS.push({key:name,label:version?`${name} ${version}`:name,expected:0,unit:'custom requirements'});toast('Custom framework created. Add individual requirements next.');renderFrameworkBuilder();}

// ---------- Shared attachment preview ----------
async function gaxGetAttachmentRecord(attachmentId){
  let db=null;
  try{
    db=await openPolicyAttachmentDb();
    const tx=db.transaction(POLICY_ATTACHMENT_STORE,'readonly');
    const item=await idbRequestResult(tx.objectStore(POLICY_ATTACHMENT_STORE).get(attachmentId));
    if(item?.blob) return {name:item.name||'document',type:item.type||'application/octet-stream',blob:item.blob,size:item.size||item.blob.size};
  }catch(err){console.warn('Attachment preview: IndexedDB unavailable; trying fallback',err);}
  finally{if(db)db.close();}
  const fallback=readPolicyAttachmentFallback().find(x=>String(x.id)===String(attachmentId));
  if(fallback?.dataUrl){
    const split=fallback.dataUrl.split(',');
    const mime=(fallback.dataUrl.match(/^data:([^;]+)/)||[])[1]||fallback.type||'application/octet-stream';
    const binary=atob(split[1]||'');
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    const blob=new Blob([bytes],{type:mime});
    return {name:fallback.name||'document',type:mime,blob,size:fallback.size||blob.size};
  }
  return null;
}
async function viewPolicyAttachment(attachmentId){
  const signedIn=gaxAuthCurrentUser();
  if(signedIn?.role==='AUDITOR'&&!gaxAuditorCanDownloadAttachment(attachmentId)){toast('Access denied: this file is not part of your approved auditor assignment.');return;}
  const previewWindow=window.open('about:blank','_blank');
  try{
    const item=await gaxGetAttachmentRecord(attachmentId);
    if(!item){if(previewWindow)previewWindow.close();toast('The original file is not available in this browser storage.');return;}
    const ext=(item.name.split('.').pop()||'').toLowerCase();
    const previewable=item.type==='application/pdf'||item.type.startsWith('image/')||['pdf','png','jpg','jpeg','gif','webp','txt','csv'].includes(ext);
    if(!previewable){if(previewWindow)previewWindow.close();toast('This file type cannot be previewed in the browser. Downloading the original file instead.');await downloadPolicyAttachment(attachmentId);return;}
    const url=URL.createObjectURL(item.blob);
    if(previewWindow){previewWindow.location.href=url;try{previewWindow.opener=null;}catch(_){};}
    else {const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.click();}
    setTimeout(()=>URL.revokeObjectURL(url),10*60*1000);
  }catch(err){if(previewWindow)previewWindow.close();console.error('Attachment preview failed',err);toast(err?.message||'Could not open this attachment.');}
}

function gaxPolicyNextVersion(version){const m=String(version||'1.0').match(/^(\d+)\.(\d+)$/);return m?`${m[1]}.${Number(m[2])+1}`:`${String(version||'1.0')}-1`;}
async function savePolicyRenewal(event,policyId){
  event.preventDefault();const form=event.currentTarget,fd=new FormData(form),file=form.elements.file.files[0];
  if(!file){toast('Upload the updated policy document.');return;}
  const validation=validatePolicyFiles([file]);if(validation){toast(validation);return;}
  const p=loadPolicyLibrary().find(x=>String(x.id)===String(policyId));if(!p){toast('Policy record not found.');return;}
  const oldVersion=p.version||'1.0';const oldAttachments=Array.isArray(p.attachments)?p.attachments.slice():[];
  try{
    const att=await storePolicyAttachment(p.id,file);
    p.version=String(fd.get('version')||'').trim();p.owner=String(fd.get('owner')||'').trim();p.reviewDate=String(fd.get('reviewDate')||'');p.updated=new Date().toISOString().slice(0,10);p.status='Under Review';
    p.versionHistory=Array.isArray(p.versionHistory)?p.versionHistory:[];
    p.versionHistory.unshift({version:oldVersion,owner:p.owner,changedAt:new Date().toISOString(),note:String(fd.get('note')||'Previous approved / reviewed version'),attachments:oldAttachments.map(a=>a.id)});
    p.attachments=[...(Array.isArray(p.attachments)?p.attachments:[]),att];
    const ok=await persistPolicyLibrary();if(!ok){toast('The file was stored but policy metadata could not be saved. Retry after checking browser storage.');return;}
    document.getElementById('policy-renewal-modal')?.remove();
    try{gaxAdminLog('Policy version updated',`${p.name}: ${oldVersion} → ${p.version}; new file ${file.name}; status Under Review.`);gaxAdminSave();}catch(_){}
    toast('New policy version and file saved. Policy is now Under Review.');
    if(location.hash==='#policies')renderPolicies();else renderDashboard();
  }catch(err){console.error('Policy renewal failed',err);toast(err?.message||'Could not save the updated policy version.');}
}

// Dashboard lifecycle notice — due in 30 days or overdue.
function gaxPolicyReviewAlertHtml(records){
  const now=new Date();now.setHours(0,0,0,0);const horizon=new Date(now);horizon.setDate(horizon.getDate()+30);
  const items=records.filter(p=>{

}

function gaxEvidenceLoad(){
  if(!gaxEvidenceState){try{gaxEvidenceState=JSON.parse(localStorage.getItem(GAX_EVIDENCE_KEY)||'null');}catch(_){gaxEvidenceState=null;}}
  if(!Array.isArray(gaxEvidenceState))gaxEvidenceState=[];
  gaxEvidenceState.forEach(x=>{if(!Array.isArray(x.comments))x.comments=[];});
  return gaxEvidenceState;
}
function gaxEvidenceSave(){try{localStorage.setItem(GAX_EVIDENCE_KEY,JSON.stringify(gaxEvidenceState));return true;}catch(err){console.error('Evidence metadata save failed',err);toast('Evidence metadata could not be saved. Browser storage may be full.');return false;}}
function gaxEvidenceCreateAccessRequest(item,auditorId,purpose,days,taskTitle,taskDueDate,taskInstructions){

function gaxEvidenceNormaliseIdentity(value){return String(value||'').trim().toLowerCase().replace(/\s+/g,' ');}
function gaxEvidenceResolveDiscussionUsers(item,extraOwners=[]){
  const state=gaxAdminLoad(),users=(state.users||[]).filter(u=>u.status==='Active'&&u.role==='USER');
  const ownerValues=[item?.owner,item?.uploadedBy,item?.createdBy,item?.assignedOwner,item?.evidenceOwner,...extraOwners].map(gaxEvidenceNormaliseIdentity).filter(Boolean);
  let matched=users.filter(u=>{
    const identities=[u.id,u.name,u.username,u.email].map(gaxEvidenceNormaliseIdentity).filter(Boolean);
    return identities.some(identity=>ownerValues.includes(identity));
  });
  // A single internal USER account is an unambiguous recipient in small single-owner demo workspaces.
  if(!matched.length&&users.length===1)matched=users;
  return matched;
}
function gaxEvidenceNotifyDiscussionParticipants(item,comment,author,extraOwners=[]){
  const state=gaxAdminLoad(),allUsers=(state.users||[]).filter(u=>u.status==='Active');
  const recipients=new Map();
  const add=(u)=>{if(u?.id&&u.status==='Active')recipients.set(String(u.id),u);};
  // Super Admins need visibility of every auditor discussion and evidence clarification.
  allUsers.filter(u=>u.role==='SUPER_ADMIN').forEach(add);
  // Notify the named evidence owner/uploader in their normal User portal.
  const mappedEvidenceUsers=gaxEvidenceResolveDiscussionUsers(item,extraOwners);
  (mappedEvidenceUsers.length?mappedEvidenceUsers:allUsers.filter(u=>u.role==='USER')).forEach(add);
  // Notify other Auditors who hold an active grant to this same evidence item.
  if(item?.id){
    gaxAdminActiveGrants().filter(g=>g.scopeType==='EVIDENCE'&&String(g.evidenceId||g.attachmentId)===String(item.id)).forEach(g=>{
      const auditor=allUsers.find(u=>u.role==='AUDITOR'&&gaxAuditorIdentityMatches(g,u));add(auditor);
    });
  }
  const authorId=String(author?.id||''),authorEmail=gaxEvidenceNormaliseIdentity(author?.email);
  const snippet=String(comment?.text||'').trim().slice(0,180);
  const commentId=String(comment?.id||`C-${Date.now()}`).replace(/[^A-Za-z0-9_-]/g,'');
  recipients.forEach(recipient=>{
    if(String(recipient.id)===authorId||(authorEmail&&gaxEvidenceNormaliseIdentity(recipient.email)===authorEmail))return;
    const isAuditor=recipient.role==='AUDITOR';
    const who=author?.name||'A team member';
    const title=author?.role==='AUDITOR'?'Auditor commented on shared evidence':'Evidence discussion updated';
    const itemName=item?.name||item?.title||'an evidence record';
    const message=`${who} (${gaxAdminRoleLabel(author?.role)}) commented on ${itemName}${snippet?`: “${snippet}”`:'.'}`;
    gaxNotificationCreate({
      id:`evt-evidence-discussion-${commentId}-${recipient.id}`,
      recipientUserId:String(recipient.id),recipientEmail:String(recipient.email||'').toLowerCase(),
      title,message,type:'info',href:isAuditor?'#auditor-workspace':'#evidence',sourceId:String(item?.id||'')
    });
  });
}
function gaxAuditNotifyEvidenceResponse(request,user,comment,file){
  const state=gaxAdminLoad(),allUsers=(state.users||[]).filter(u=>u.status==='Active'),recipients=new Map();
  const add=(u)=>{if(u?.id&&u.status==='Active')recipients.set(String(u.id),u);};
  allUsers.filter(u=>u.role==='SUPER_ADMIN').forEach(add);
  // The request owner is the operational User who should receive the Auditor's response.
  const mappedRequestOwners=gaxEvidenceResolveDiscussionUsers({owner:request?.owner,uploadedBy:request?.requestedBy},[request?.owner]);
  (mappedRequestOwners.length?mappedRequestOwners:allUsers.filter(u=>u.role==='USER')).forEach(add);
  const authorEmail=gaxEvidenceNormaliseIdentity(user?.email),authorId=String(user?.id||'');
  const snippet=String(comment?.text||'').trim().slice(0,180);
  const commentId=String(comment?.id||`AC-${Date.now()}`).replace(/[^A-Za-z0-9_-]/g,'');
  recipients.forEach(recipient=>{
    if(String(recipient.id)===authorId||(authorEmail&&gaxEvidenceNormaliseIdentity(recipient.email)===authorEmail))return;
    gaxNotificationCreate({
      id:`evt-audit-response-${commentId}-${recipient.id}`,
      recipientUserId:String(recipient.id),recipientEmail:String(recipient.email||'').toLowerCase(),
      title:'Auditor submitted an audit response',
      message:`${user?.name||'Auditor'} responded to “${request?.title||'Evidence request'}”${file?` and uploaded ${file.name}`:''}${snippet?`: “${snippet}”`:'.'}`,
      type:'success',href:'#audits',auditTab:'requests',sourceId:String(request?.id||'')
    });
  });
}
function gaxEvidenceAddComment(event,evidenceId){
  event.preventDefault();const form=event.currentTarget,body=String(new FormData(form).get('comment')||'').trim();if(!body)return;
  const user=gaxAuthCurrentUser();if(!user){toast('Sign in to comment.');return;}
  if(user.role==='AUDITOR'&&!gaxAuditorCanDownloadAttachment(evidenceId)){toast('You do not have permission to comment on this evidence.');return;}
  const item=gaxEvidenceLoad().find(x=>String(x.id)===String(evidenceId));if(!item){toast('Evidence record not found.');return;}
  item.comments=Array.isArray(item.comments)?item.comments:[];
  const comment={id:`EC-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,text:body,author:user.name,authorId:user.id,authorEmail:user.email||'',role:user.role,at:new Date().toISOString()};
  item.comments.push(comment);
  if(!gaxEvidenceSave())return;
  try{
    gaxAdminLog('Evidence comment added',`${user.name} commented on ${item.name}.`,user.name);gaxAdminSave();
    gaxEvidenceNotifyDiscussionParticipants(item,comment,user);
  }catch(err){console.warn('Evidence comment notifications could not be created',err);}
  document.getElementById('gax-evidence-comments-modal')?.remove();
  if(user.role==='AUDITOR')renderAuditor();else renderEvidenceVault();
  if(typeof gaxRefreshNotificationBell==='function')gaxRefreshNotificationBell();
  toast('Comment posted. Notifications were added for the Super Admin and the evidence owner, where identified.');
}

// Extend the existing Super Admin approval record for Evidence Vault items.
function gaxAdminApproveRequest(requestId){
  const s=gaxAdminLoad(),r=s.requests.find(x=>x.id===requestId);if(!r||r.status!=='Pending')return;
  const user=s.users.find(u=>u.id===r.auditorId&&u.role==='AUDITOR'&&u.status==='Active');if(!user){toast('The assigned auditor is no longer active.');return;}
  if(r.scopeType==='EVIDENCE'&&!gaxEvidenceLoad().some(e=>String(e.id)===String(r.evidenceId))){toast('The Evidence Vault file no longer exists.');return;}
  const grantedAt=new Date(),expiresAt=new Date(grantedAt.getTime()+Math.max(1,Number(r.requestedDays)||7)*86400000);
  r.status='Approved';r.reviewedAt=grantedAt.toISOString();r.reviewedBy=gaxAdminCurrentActorName();r.accessMode='VIEW_ONLY';r.grantId=`GRANT-${Date.now()}`;
  let grant=null;
  if(r.scopeType!=='TASK_ONLY'){
    grant={id:r.grantId,requestId:r.id,auditorId:r.auditorId,auditorName:r.auditorName,auditorEmail:r.auditorEmail,scopeType:r.scopeType||'NAMED',policyId:r.policyId||'',attachmentId:r.attachmentId||'',evidenceId:r.evidenceId||'',folderCategory:r.folderCategory||'',documentName:r.documentName,framework:r.framework,purpose:r.purpose,accessMode:'VIEW_ONLY',grantedAt:grantedAt.toISOString(),expiresAt:expiresAt.toISOString(),status:'Active'};
    s.grants.unshift(grant);
  }else r.grantId='';
  if(r.taskTitle){if(!Array.isArray(s.tasks))s.tasks=[];const task={id:`ATASK-${Date.now()}`,requestId:r.id,grantId:grant?.id||'',auditorId:r.auditorId,auditorEmail:r.auditorEmail||user.email,auditorName:r.auditorName,title:r.taskTitle,framework:r.framework,dueDate:r.taskDueDate||'',instructions:r.taskInstructions||`Review ${r.documentName} for the assigned audit scope.`,status:'Assigned',assignedAt:grantedAt.toISOString(),assignedBy:gaxAdminCurrentActorName()};s.tasks.unshift(task);r.taskId=task.id;}
  gaxAdminLog('Auditor assignment approved',r.scopeType==='TASK_ONLY'?`${r.auditorName} assigned task “${r.taskTitle}” without document access.`:`${r.auditorName} granted read-only access to ${r.documentName} until ${expiresAt.toLocaleString()}${r.taskTitle?`; assigned task: ${r.taskTitle}`:''}.`);
  if(gaxAdminSave()){toast(r.scopeType==='TASK_ONLY'?'Auditor task assigned without document access.':'Read-only access granted to the selected content.');renderAdministrator();}
}

// ---------- Auditor workspace: approved evidence details and two-way review comments ----------
function gaxAuditorCanDownloadAttachment(attachmentId){
  const user=gaxAuditorCurrentUser();if(!user)return false;
  const policy=loadPolicyLibrary().find(p=>(Array.isArray(p.attachments)?p.attachments:[]).some(a=>String(a.id)===String(attachmentId)));
  if(policy)return gaxAuditorAllowedAttachments(policy).some(a=>String(a.id)===String(attachmentId));
  const evidence=gaxEvidenceLoad().find(x=>String(x.id)===String(attachmentId));
  if(!evidence)return false;
  return gaxAdminActiveGrants().some(g=>gaxAuditorIdentityMatches(g,user)&&g.scopeType==='EVIDENCE'&&String(g.evidenceId)===String(evidence.id));
}
async function gaxAuditAuditorSubmitEvidence(event,requestId){
  event.preventDefault();
  const user=gaxAuthCurrentUser();
  if(!user||user.role!=='AUDITOR'){toast('Only the assigned Auditor can respond to this request.');return;}
  const request=gaxAuditLoad().requests.find(r=>String(r.id)===String(requestId)&&gaxAuditorIdentityMatches(r,user));
  if(!request){toast('This audit evidence request is not assigned to your account.');return;}
  if(['Accepted','Rejected','Closed'].includes(request.status)){toast('This request is closed for responses.');return;}
  const form=event.currentTarget,fd=new FormData(form),file=form.elements.file?.files?.[0],note=String(fd.get('responseNote')||'').trim();
  if(!file&&!note){toast('Attach the requested evidence or enter a response note.');return;}
  try{
    if(file){const invalid=validatePolicyFiles([file]);if(invalid){toast(invalid);return;}}
    let attachment=null;
    if(file)attachment=await storePolicyAttachment(`AUDIT_REQUEST_RESPONSE:${request.id}`,file);
    if(!Array.isArray(request.responseAttachments))request.responseAttachments=[];
    if(attachment)request.responseAttachments.push({id:attachment.id,name:attachment.name,type:attachment.type,size:attachment.size,uploadedAt:attachment.uploadedAt,uploadedBy:user.name});
    request.responseNote=note;
    request.responseSubmittedAt=new Date().toISOString();
    request.status='Submitted';
    request.comments=Array.isArray(request.comments)?request.comments:[];
    const responseComment=note?{id:`AC-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,author:user.name,authorId:user.id,authorEmail:user.email||'',role:'AUDITOR',text:note,at:request.responseSubmittedAt}:null;
    if(responseComment)request.comments.push(responseComment);
    gaxAuditSave();
    gaxAdminLog('Auditor submitted audit evidence response',`${user.name} responded to ${request.id}: ${request.title}${file?`; file: ${file.name}`:''}.`,user.name);
    gaxAdminSave();
    gaxAuditNotifyEvidenceResponse(request,user,responseComment||{id:`AC-${Date.now()}`,text:'Evidence response submitted.'},file);
    if(typeof gaxRefreshNotificationBell==='function')gaxRefreshNotificationBell();
    renderAuditor();
    toast('Audit evidence response submitted. Notifications were sent to the Super Admin and the request owner, where identified.');
  }catch(err){console.error('Auditor evidence response failed',err);toast(err?.message||'The evidence response could not be saved.');}
}

function gaxAuditorIdentityMatches(record,user){
  if(!record||!user)return false;
  const ids=[record.assignedAuditorId,record.auditorId,record.userId,record.assignedToId].filter(Boolean).map(String);
  if(user.id&&ids.includes(String(user.id)))return true;
  const norm=v=>String(v||'').trim().toLowerCase();
  const emails=[record.assignedAuditorEmail,record.auditorEmail,record.userEmail,record.assignedToEmail,emailOf(record)].map(norm).filter(Boolean);
  if(user.email&&emails.includes(norm(user.email)))return true;
  const names=[record.assignedAuditorUsername,record.auditorUsername,record.username,record.assignedToUsername].map(norm).filter(Boolean);
  if(user.username&&names.includes(norm(user.username)))return true;
  return false;
}
function emailOf(record){return record&&record.email?record.email:'';}
function gaxAuditorReloadLocalState(){
  // Rehydrate shared browser-local records so changes made in another tab are visible.
  gaxAdminState=null;gaxAuditState=null;gaxEvidenceState=null;
  gaxAdminLoad();gaxAuditLoad();gaxEvidenceLoad();
}
function gaxAuditorRefreshWorkspace(){gaxAuditorReloadLocalState();renderAuditor();toast('Auditor assignments refreshed from this browser profile.');}
function gaxAuditorGrantResolves(grant){
  if(!grant)return false;
  if(grant.scopeType==='EVIDENCE')return gaxEvidenceLoad().some(e=>String(e.id)===String(grant.evidenceId||grant.attachmentId));
  const library=loadPolicyLibrary();
  if(grant.scopeType==='POLICY')return library.some(p=>String(p.id)===String(grant.policyId));
  if(grant.scopeType==='FILE')return library.some(p=>String(p.id)===String(grant.policyId)&&(p.attachments||[]).some(a=>String(a.id)===String(grant.attachmentId)));
  if(grant.scopeType==='FOLDER')return library.some(p=>String(p.category||'Uncategorised')===String(grant.folderCategory||''));
  return false;
}
